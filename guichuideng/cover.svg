<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1115"/>
      <stop offset="55%" stop-color="#07090c"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="14%" r="62%">
      <stop offset="0" stop-color="#e8cf9a" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#c9a15c" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a3b"/>
      <stop offset="42%" stop-color="#e8cf9a"/>
      <stop offset="100%" stop-color="#8a6a3b"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".92"/>
    </radialGradient>
    <pattern id="bricks" width="120" height="56" patternUnits="userSpaceOnUse">
      <rect width="120" height="56" fill="none"/>
      <path d="M0 0H120M0 28H120M0 56H120" stroke="#1d262c" stroke-width="1.6" opacity=".85"/>
      <path d="M30 0V28M90 0V28M60 28V56M0 28V56M120 28V56" stroke="#1d262c" stroke-width="1.6" opacity=".85"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#bricks)" opacity=".5"/>
  <rect width="1200" height="675" fill="url(#torch)"/>
  <ellipse cx="600" cy="120" rx="420" ry="150" fill="#e8cf9a" opacity=".07" filter="url(#soft)"/>

  <!-- 墓道透视 -->
  <path d="M0 675 L360 300 L840 300 L1200 675 Z" fill="#0a0d10" opacity=".9"/>
  <path d="M360 300 L840 300 L840 316 L360 316 Z" fill="#1a2228" opacity=".8"/>
  <path d="M0 675 L360 300 M1200 675 L840 300" stroke="#2a343c" stroke-width="2" fill="none" opacity=".7"/>
  <path d="M300 675 L420 316 M900 675 L780 316" stroke="#1e272d" stroke-width="1.5" fill="none" opacity=".7"/>
  <path d="M240 675 L470 316 M960 675 L730 316" stroke="#161d22" stroke-width="1.5" fill="none" opacity=".55"/>

  <!-- 罗盘 -->
  <g transform="translate(600,392)" opacity=".95">
    <circle r="150" fill="#07090c" opacity=".72"/>
    <circle r="150" fill="none" stroke="#c9a15c" stroke-opacity=".38" stroke-width="1.6"/>
    <circle r="132" fill="none" stroke="#c9a15c" stroke-opacity=".2" stroke-width="1.2"/>
    <circle r="96" fill="none" stroke="#c9a15c" stroke-opacity=".14" stroke-width="1"/>
    <g stroke="#c9a15c" stroke-opacity=".30" stroke-width="1.4">
      <path d="M0 -150V-136"/><path d="M0 150V136"/><path d="M-150 0H-136"/><path d="M150 0H136"/>
      <path d="M106 -106L96 -96"/><path d="M-106 -106L-96 -96"/><path d="M106 106L96 96"/><path d="M-106 106L-96 96"/>
    </g>
    <g stroke="#c9a15c" stroke-opacity=".13" stroke-width="1">
      <path d="M0 -150L0 -142" transform="rotate(30)"/><path d="M0 -150L0 -142" transform="rotate(60)"/>
      <path d="M0 -150L0 -142" transform="rotate(120)"/><path d="M0 -150L0 -142" transform="rotate(150)"/>
      <path d="M0 -150L0 -142" transform="rotate(210)"/><path d="M0 -150L0 -142" transform="rotate(240)"/>
      <path d="M0 -150L0 -142" transform="rotate(300)"/><path d="M0 -150L0 -142" transform="rotate(330)"/>
    </g>
    <!-- 八门 -->
    <g fill="#c9a15c" fill-opacity=".62" font-size="12" font-family="KaiTi,serif" text-anchor="middle">
      <text x="0" y="-104">大禹陵</text><text x="76" y="-72">殷墟</text>
      <text x="106" y="4">茂陵</text><text x="76" y="82">曹操</text>
      <text x="0" y="112">隋陵</text><text x="-76" y="82">乾陵</text>
      <text x="-106" y="4">元陵</text><text x="-76" y="72">秦陵</text>
    </g>
    <!-- 针 -->
    <path d="M0 -118 L7 -14 L0 0 L-7 -14 Z" fill="#e8cf9a" opacity=".9"/>
    <path d="M0 118 L-6 14 L0 0 L6 14 Z" fill="#3a4750" opacity=".85"/>
    <circle r="8" fill="#07090c" stroke="#c9a15c" stroke-width="2"/>
  </g>

  <!-- 水银的河 -->
  <path d="M-20 596 C 220 566, 420 622, 640 592 S 1040 566, 1220 600" stroke="#9fb4bd" stroke-opacity=".30" stroke-width="2.4" fill="none"/>
  <path d="M-20 614 C 200 588, 440 636, 660 610 S 1060 588, 1220 618" stroke="#9fb4bd" stroke-opacity=".16" stroke-width="1.6" fill="none"/>

  <!-- 标题 -->
  <g text-anchor="middle" font-family="KaiTi,STKaiti,serif">
    <text x="600" y="150" font-size="96" letter-spacing="20" fill="url(#gold)">鬼吹灯</text>
    <text x="600" y="200" font-size="23" letter-spacing="16" fill="#c9a15c" fill-opacity=".8">八 座 大 墓</text>
    <text x="600" y="248" font-size="15" letter-spacing="4" fill="#a79e8e" fill-opacity=".85">发丘印，摸金符，护身不护鬼吹灯</text>
  </g>

  <!-- 印章 -->
  <g transform="translate(1010,96)">
    <rect x="0" y="0" width="76" height="76" rx="3" fill="none" stroke="#c0392b" stroke-width="2.4" opacity=".85"/>
    <text x="38" y="52" text-anchor="middle" font-size="40" font-family="KaiTi,serif" fill="#c0392b" opacity=".9">灯</text>
  </g>

  <!-- 底下那把蜡烛 -->
  <g transform="translate(600,646)">
    <rect x="-7" y="-30" width="14" height="30" rx="2" fill="#2a2118" stroke="#3d4a54" stroke-width="1"/>
    <ellipse cx="0" cy="-38" rx="6" ry="11" fill="#e8cf9a" opacity=".85"/>
    <ellipse cx="0" cy="-38" rx="12" ry="20" fill="#e8cf9a" opacity=".18"/>
  </g>

  <rect width="1200" height="675" fill="url(#vig)"/>
  <rect x="18" y="18" width="1164" height="639" fill="none" stroke="#c9a15c" stroke-opacity=".22" stroke-width="1.4"/>
</svg>
